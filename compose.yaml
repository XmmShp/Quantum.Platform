services:
  platform:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__postgres: Host=koala-pp-postgresql;Port=5432;Database=quantum_platform;Username=quantum_platform;Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      QuantumPlatform__Jwt__SigningKey: ${QUANTUM_PLATFORM_JWT_SIGNING_KEY:?set QUANTUM_PLATFORM_JWT_SIGNING_KEY}
      QuantumPlatform__Storage__BasePath: /app/Files
      QuantumPlatform__AutomatedReview__Enabled: ${QUANTUM_PLATFORM_AUTOMATED_REVIEW_ENABLED:-false}
      QuantumPlatform__AutomatedReview__Model: ${QUANTUM_PLATFORM_AGENTFN_MODEL:-deepseek/deepseek-v4-pro}
    ports:
      - "127.0.0.1:5080:8080"
    volumes:
      - platform-files:/app/Files
    networks:
      sakura:
        aliases:
          - quantum-platform
      database:

volumes:
  platform-files:

networks:
  sakura:
    external: true
    name: agentfn-overlay-net
  database:
    external: true
    name: koala-pp-overlay-net
