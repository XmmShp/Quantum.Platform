name: Deploy production

on:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: quantum-platform-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to 192.168.50.202
    runs-on: [self-hosted, Linux, X64, quantum-platform-prod]
    environment:
      name: production
      url: https://quantum.io-vii.com
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Verify deployment host
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "koala2"
          test -r "$HOME/.config/quantum-platform/production.env"
          docker info >/dev/null
          docker network inspect agentfn-overlay-net >/dev/null
          docker network inspect koala-pp-overlay-net >/dev/null

      - name: Build and deploy
        shell: bash
        run: |
          set -euo pipefail
          docker compose \
            --project-name quantum-platform \
            --env-file "$HOME/.config/quantum-platform/production.env" \
            up --detach --build --remove-orphans

      - name: Verify health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:5080/health/live >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose \
            --project-name quantum-platform \
            --env-file "$HOME/.config/quantum-platform/production.env" \
            logs --tail=200
          exit 1
