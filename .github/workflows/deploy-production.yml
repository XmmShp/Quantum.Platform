name: Deploy production

on:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: quantum-platform-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: [self-hosted, Linux, X64, quantum-platform-prod]
    environment:
      name: production
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Preflight
        shell: bash
        run: |
          set -euo pipefail
          test -r "$HOME/.config/quantum-platform/production.env"
          test -r "$HOME/.config/quantum-platform/quantum-platform-email.json"
          test -r "$HOME/.config/quantum-platform/quantum-platform-review.private.jwks.json"
          docker info >/dev/null

      - name: Deploy
        shell: bash
        run: |
          set -euo pipefail
          export QUANTUM_PLATFORM_EMAIL_CONFIG_FILE="$HOME/.config/quantum-platform/quantum-platform-email.json"
          export QUANTUM_PLATFORM_AGENTFN_PRIVATE_JWKS_FILE="$HOME/.config/quantum-platform/quantum-platform-review.private.jwks.json"
          docker compose --progress quiet \
            -f compose.yaml \
            -f compose.production.yaml \
            -f compose.agentfn.yaml \
            --project-name quantum-platform \
            --env-file "$HOME/.config/quantum-platform/production.env" \
            up --detach --build --remove-orphans --quiet-pull

      - name: Verify health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:5080/health/live >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Deployment health check failed." >&2
          exit 1
