name: Build and test

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  DOTNET_VERSION: "10.0.x"
  CONFIGURATION: "Release"

jobs:
  build-test:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore
        run: dotnet restore Quantum.Platform.slnx --verbosity quiet
      - name: Build
        run: dotnet build Quantum.Platform.slnx -c ${{ env.CONFIGURATION }} --no-restore --verbosity quiet
      - name: Test
        run: dotnet test tests/Quantum.Platform.Tests/Quantum.Platform.Tests.csproj -c ${{ env.CONFIGURATION }} --no-build --verbosity quiet
