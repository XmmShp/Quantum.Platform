services:
  platform:
    image: ${QUANTUM_PLATFORM_IMAGE:?set QUANTUM_PLATFORM_IMAGE}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_ENVIRONMENT: Production
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
    networks:
      sakura:
        aliases:
          - quantum-platform
      database:
    secrets:
      - source: appsettings
        target: /app/appsettings.Production.json
        mode: 0444
      - source: email
        target: /run/secrets/quantum-platform-email
        mode: 0444
      - source: review-jwks
        target: /run/secrets/agentfn-review-private-jwks
        mode: 0444
    volumes:
      - platform-files:/app/Files
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == ${QUANTUM_PLATFORM_STORAGE_NODE:?set QUANTUM_PLATFORM_STORAGE_NODE}
      update_config:
        parallelism: 1
        order: stop-first
        monitor: 60s
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first
        monitor: 60s
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        limits:
          memory: 1G
      labels:
        quantum-platform.component: platform
        quantum-platform.deployment-id: ${QUANTUM_PLATFORM_DEPLOYMENT_ID:?set QUANTUM_PLATFORM_DEPLOYMENT_ID}

volumes:
  platform-files:
    external: true
    name: quantum-platform_platform-files

networks:
  sakura:
    external: true
    name: agentfn-overlay-net
  database:
    external: true
    name: koala-pp-overlay-net

secrets:
  appsettings:
    external: true
    name: ${QUANTUM_PLATFORM_APPSETTINGS_SECRET:?set QUANTUM_PLATFORM_APPSETTINGS_SECRET}
  email:
    external: true
    name: ${QUANTUM_PLATFORM_EMAIL_SECRET:?set QUANTUM_PLATFORM_EMAIL_SECRET}
  review-jwks:
    external: true
    name: ${QUANTUM_PLATFORM_REVIEW_JWKS_SECRET:?set QUANTUM_PLATFORM_REVIEW_JWKS_SECRET}
